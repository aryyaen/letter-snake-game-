name: Publish Letter Snake 3D to GitHub Pages (static build)

on:
  push:
    branches: [main]
    paths:
      - "letter-snake-3d-multiplayer-v2.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract the supplied game
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -tq letter-snake-3d-multiplayer-v2.zip
          unzip -oq letter-snake-3d-multiplayer-v2.zip -d _site
          test -s _site/index.html
          test -s _site/js/game.js
          touch _site/.nojekyll
          for file in _site/js/*.js; do node --check "$file"; done

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
